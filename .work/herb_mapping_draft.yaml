# HERB settings-file KEY — DRAFT (hand-authored from the probe output, 2026-05-30)
# This is the per-dataset "key": the only thing a human writes. It declares
# MEANING over the structural schema the probe recovered automatically.
# The probe already gives: collections, nesting, scalar attributes, doc-leaves,
# source names. This file only adds: identity, cross-references, content-leaf
# choice, labels, and what to hold out from the corpus.
#
# Everything NOT mentioned here still decomposes automatically (scalars ->
# queryable properties, nesting -> containment edges). Silence = "mirror it".

dataset: Salesforce__HERB

# ---- where corpus entities live ----
# Each product file (products/*.json) is one tree. metadata/*.json are the
# cross-file directories that product records point into.

entities:

  # --- from products/*.json ---

  Message:                          # source name: slack
    from: /slack/*
    label: "Slack message"
    id: id                          # stable node id (identity)
    content: Message/User/text      # the doc-leaf: referenced, not decomposed
    # scalar properties decompose automatically; listed only for clarity:
    properties: [Message/User/timestamp, Message/User/userId,
                 Message/User/utterranceID, Channel/channelID, Channel/name]
    refs:
      - {from: Message/User/userId, to: Employee}        # cross-reference
    # NOTE: Reactions[] and ThreadReplies[] are ALWAYS empty across all 30
    # products — vestigial. Mirror as empty; nothing to do.

  PullRequest:                      # source name: prs
    from: /prs/*
    label: "Pull request"
    id: id
    content: summary
    properties: [number, created_at, title, state, merged, mergeable, link]
    refs:
      - {from: user/login, to: PrAuthor}   # EMP_* id space — NOT Employee (verified: 0 EMP_ ids in employee.json)
    children:
      Review:                       # nested collection — probe found it
        from: reviews/*
        content: comment
        properties: [state, submitted_at]
        refs:
          - {from: user/login, to: PrAuthor}

  Document:                         # source name: documents
    from: /documents/*
    id: id
    content: [content, feedback]    # two doc-leaves on one record
    properties: [author, date, type, document_link]
    refs:
      - {from: author, to: Employee}

  Transcript:                       # source name: meeting_transcripts
    from: /meeting_transcripts/*
    id: id
    content: transcript
    properties: [date, document_type]
    refs:
      - {from: participants/*, to: Employee}             # list-valued cross-ref

  MeetingChat:                      # source name: meeting_chats (empty in many products)
    from: /meeting_chats/*
    id: id
    content: text                   # short here (maxlen 128) — still its own unit

  Url:                              # source name: urls
    from: /urls/*
    id: id
    content: description
    properties: [link]

  # --- product-level membership lists (scalar id arrays, not records) ---
  # These are pure cross-references, not content. They link the product to
  # entities defined in metadata/.
  product_refs:
    - {from: /team/*, to: Employee}
    - {from: /customers/*, to: Customer}

  # --- from metadata/ (cross-file entity directories) — RESOLVED ---
  Employee:
    from_file: metadata/employee.json          # flat dict keyed by eid_xxxxxxxx (530 people)
    id: employee_id                            # == the dict key (verified)
    properties: [name, role, location, org]
    org_tree: metadata/salesforce_team.json    # nested hierarchy -> :REPORTS_TO edges between employee_ids
  Customer:
    from_file: metadata/customers_data.json    # list of 120, {name, role, company, id}
    id: id                                     # CUST-#### (product customers[] resolve 22/22)
    properties: [name, role, company]
  PrAuthor:
    # EMP_######### logins on prs/reviews. Separate id space, NO directory to
    # enrich from (0 EMP_ ids in employee.json). Bare identity node, id = login.
    id: login

# ---- EVAL HOLDOUT — NOT corpus, do NOT tag as knowledge ----
# answerable_questions carries ground_truth + citations = the eval oracle.
# This is the contamination that polluted the `herb` DB. In v2 it is quarantined
# from the corpus and used only as the evaluation set.
eval_holdout:
  answerable_questions:
    question: question
    answer: ground_truth            # RAGGED across products (array | str) — normalize on load
    citations: citations            # each citation references an evidence record id
    citation_target: [Message, Document, PullRequest, Transcript, Url]  # resolve by id
  unanswerable_questions:
    question: "*"                   # bare string array

# ---- identity — RESOLVED empirically (2026-05-30) ----
# Two DISTINCT people id spaces, confirmed against the metadata directories:
#   eid_xxxxxxxx (employee.json, 530)  <- slack userId (54/56), team[] (44/44),
#                                         doc author (15/15), participants (33/33)  => :Employee
#   EMP_######### (pr/review login)    <- NOT in employee.json at all (0 matches) => :PrAuthor
# They do NOT merge. PR authors are a directory-less population.
#
# Unresolved-ref policy ([[no-silent-fallbacks]]): a few slack userIds (2/56)
# don't resolve to any eid. Flag unresolved refs loudly; do NOT silently drop
# the edge or invent a node.

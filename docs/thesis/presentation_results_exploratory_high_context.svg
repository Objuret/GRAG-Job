<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">Exploratory high-context run</title>
  <desc id="desc">Portrait chart comparing graph retrieval and full-text baseline in the exploratory high-context run.</desc>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font-family: Arial, sans-serif; font-size: 38px; font-weight: 700; fill: #111827; }
      .section { font-family: Arial, sans-serif; font-size: 25px; font-weight: 700; fill: #111827; }
      .legend { font-family: Arial, sans-serif; font-size: 19px; fill: #374151; }
      .metric { font-family: Arial, sans-serif; font-size: 19px; fill: #111827; }
      .tick { font-family: Arial, sans-serif; font-size: 15px; fill: #6b7280; }
      .value { font-family: Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #111827; }
      .grid { stroke: #e5e7eb; stroke-width: 1; }
      .axis { stroke: #cbd5e1; stroke-width: 1.2; }
      .graph { fill: #2563eb; }
      .base { fill: #f97316; }
      .rule { stroke: #d1d5db; stroke-width: 1.5; }
    </style>
  </defs>

  <rect class="bg" width="900" height="1200"/>

  <text class="title" x="70" y="72">Exploratory High-Context Run</text>

  <g transform="translate(70,112)">
    <rect class="graph" x="0" y="0" width="24" height="16" rx="2"/>
    <text class="legend" x="34" y="15">Graph retrieval</text>
    <rect class="base" x="245" y="0" width="24" height="16" rx="2"/>
    <text class="legend" x="279" y="15">Full-text baseline</text>
  </g>

  <line class="rule" x1="70" y1="160" x2="830" y2="160"/>

  <g transform="translate(70,210)">
    <text class="section" x="0" y="0">Quality Metrics</text>

    <g transform="translate(0,52)">
      <line class="grid" x1="205" y1="0" x2="205" y2="270"/>
      <line class="grid" x1="330" y1="0" x2="330" y2="270"/>
      <line class="grid" x1="455" y1="0" x2="455" y2="270"/>
      <line class="grid" x1="580" y1="0" x2="580" y2="270"/>
      <line class="grid" x1="705" y1="0" x2="705" y2="270"/>
      <line class="axis" x1="205" y1="270" x2="705" y2="270"/>

      <text class="tick" x="198" y="294">0</text>
      <text class="tick" x="323" y="294">0.25</text>
      <text class="tick" x="448" y="294">0.50</text>
      <text class="tick" x="573" y="294">0.75</text>
      <text class="tick" x="694" y="294">1.00</text>

      <text class="metric" x="0" y="37">Faithfulness</text>
      <rect class="graph" x="205" y="13" width="383" height="22" rx="3"/>
      <rect class="base" x="205" y="43" width="382" height="22" rx="3"/>
      <text class="value" x="600" y="31">0.766</text>
      <text class="value" x="599" y="61">0.764</text>

      <text class="metric" x="0" y="127">Context recall</text>
      <rect class="graph" x="205" y="103" width="313" height="22" rx="3"/>
      <rect class="base" x="205" y="133" width="385" height="22" rx="3"/>
      <text class="value" x="530" y="121">0.625</text>
      <text class="value" x="602" y="151">0.770</text>

      <text class="metric" x="0" y="217">Context precision</text>
      <rect class="graph" x="205" y="193" width="35" height="22" rx="3"/>
      <rect class="base" x="205" y="223" width="58" height="22" rx="3"/>
      <text class="value" x="252" y="211">0.070</text>
      <text class="value" x="275" y="241">0.116</text>
    </g>
  </g>

  <line class="rule" x1="70" y1="580" x2="830" y2="580"/>

  <g transform="translate(70,635)">
    <text class="section" x="0" y="0">Context Use, Median</text>

    <g transform="translate(0,52)">
      <line class="grid" x1="205" y1="0" x2="205" y2="300"/>
      <line class="grid" x1="330" y1="0" x2="330" y2="300"/>
      <line class="grid" x1="455" y1="0" x2="455" y2="300"/>
      <line class="grid" x1="580" y1="0" x2="580" y2="300"/>
      <line class="grid" x1="705" y1="0" x2="705" y2="300"/>
      <line class="axis" x1="205" y1="300" x2="705" y2="300"/>

      <text class="metric" x="0" y="44">Input tokens</text>
      <rect class="graph" x="205" y="20" width="418" height="22" rx="3"/>
      <rect class="base" x="205" y="50" width="500" height="22" rx="3"/>
      <text class="value" x="635" y="38">74,802</text>
      <text class="value" x="717" y="68">89,542</text>

      <text class="metric" x="0" y="144">Retrieved chunks</text>
      <rect class="graph" x="205" y="120" width="407" height="22" rx="3"/>
      <rect class="base" x="205" y="150" width="500" height="22" rx="3"/>
      <text class="value" x="624" y="138">122</text>
      <text class="value" x="717" y="168">150</text>

      <text class="metric" x="0" y="244">Context chars</text>
      <rect class="graph" x="205" y="220" width="392" height="22" rx="3"/>
      <rect class="base" x="205" y="250" width="500" height="22" rx="3"/>
      <text class="value" x="609" y="238">388,198</text>
      <text class="value" x="717" y="268">494,703</text>
    </g>
  </g>
</svg>

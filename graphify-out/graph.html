munity_name": "v3/README.md \u2014 the in-repo canon design...", "source_file": "A:/exjobbet/repo/v3/README.md", "file_type": "document", "degree": 22}, {"id": "v3_readme_three_arms", "label": "The harness runs chosen HERB questions through three arms \u2014 artifact (the artefact graph: interpreter \u2192 facet retrieval \u2192 answer, system under test), lucene (BM25 baseline, own index), vector (dense naive-RAG baseline, own index) \u2014 and scores each arm's an", "color": {"background": "#59A14F", "border": "#59A14F", "highlight": {"background": "#ffffff", "border": "#59A14F"}}, "size": 18.3, "font": {"size": 12, "color": "#ffffff"}, "title": "The harness runs chosen HERB questions through three arms \u2014 artifact (the artefact graph: interpreter \u2192 facet retrieval \u2192 answer, system under test), lucene (BM25 baseline, own index), vector (dense naive-RAG baseline, own index) \u2014 and scores each arm&#x27;s an", "community": 14, "community_name": "Three arms (artefact/lucene/vector), one...", "source_file": "A:/exjobbet/repo/v3/README.md", "file_type": "rationale", "degree": 8}, {"id": "v3_readme_one_shared_generator", "label": "All three arms answer with the SAME generator (built once in the orchestrator and injected) so any difference is retrieval, not the LLM; beyond that generator and the corpus on disk the arms share nothing \u2014 each reads, indexes and ranks the corpus with its", "color": {"background": "#59A14F", "border": "#59A14F", "highlight": {"background": "#ffffff", "border": "#59A14F"}}, "size": 13.1, "font": {"size": 0, "color": "#ffffff"}, "title": "All three arms answer with the SAME generator (built once in the orchestrator and injected) so any difference is retrieval, not the LLM; beyond that generator and the corpus on disk the arms share nothing \u2014 each reads, indexes and ranks the corpus with its", "community": 14, "community_name": "Three arms (artefact/lucene/vector), one...", "source_file": "A:/exjobbet/repo/v3/README.md", "file_type": "rationale", "degree": 3}, {"id": "v3_readme_ragas_only_scorer", "label": "RAGAS (eval/ragas.py) is the only scorer; the full RAGAS metric menu lives in eval/ragas_catalog.py \u2014 every judge-free deterministic metric always runs (costs nothing) and SELECTED adds the judged ones.", "color": {"background": "#9C755F", "border": "#9C755F", "highlight": {"background": "#ffffff", "border": "#9C755F"}}, "size": 14.1, "font": {"size": 0, "color": "#ffffff"}, "title": "RAGAS (eval/ragas.py) is the only scorer; the full RAGAS metric menu lives in eval/ragas_catalog.py \u2014 every judge-free deterministic metric always runs (costs nothing) and SELECTED adds the judged ones.", "community": 8, "community_name": "v3/README.md \u2014 the in-repo canon design...", "source_file": "A:/exjobbet/repo/v3/README.md", "file_type": "rationale", "degree": 4}, {"id": "v3_readme_deterministic_id_context", "label": "The deterministic RAGAS backbone is ID-based context precision/recall against the gold citations (IDBasedContextPrecision / IDBasedContextRecall, no judge); the judged picks are faithfulness, answer correctness, context precision and context recall.", "color": {"background": "#9C755F", "border": "#9C755F", "highlight": {"background": "#ffffff", "border": "#9C755F"}}, "size": 12.1, "font": {"size": 0, "color": "#ffffff"}, "title": "The deterministic RAGAS backbone is ID-based context precision/recall against the gold citations (IDBasedContextPrecision / IDBasedContextRecall, no judge); the judged picks are faithfulness, answer correctness, context precision and context recall.", "community": 8, "community_name": "v3/README.md \u2014 the in-repo canon design...", "source_file": "A:/exjobbet/repo/v3/README.md", "file_type": "rationale", "degree": 2}, {"id": "v3_readme_faithfulness_transfers_no_gold", "label": "Faithfulness needs no reference so it transfers to a no-gold set later; the other three judged metrics (answer correctness, context precision, context recall) lean on the gold answer / citations.", "color": {"background": "#9C755F", "border": "#9C755F", "highlight": {"background": "#ffffff", "border": "#9C755F"}}, "size": 12.1, "font": {"size": 0, "color": "#ffffff"}, "title": "Faithfulness needs no reference so it transfers to a no-gold set later; the other three judged metrics (answer correctness, context precision, context recall) lean on the gold answer / citations.", "community": 8, "community_name": "v3/README.md \u2014 the in-repo canon design...", "source_file": "A:/exjobbet/repo/v3/README.md", "file_type": "rationale", "degree": 2}, {"id": "v3_readme_raw_per_question_records", "label": "RAGAS emits raw per-question records (EvalResult, tidy long format) with nothing pre-aggregated, so paired tests, CIs, per-type splits and judge calibration are all possible downstream.", "color": {"background": "#9C755F", "border": "#9C755F", "highlight": {"background": "#ffffff", "border": "#9C755F"}}, "size": 13.1, "font": {"size": 0, "color": "#ffffff"}, "title": "RAGAS emits raw per-question records (EvalResult, tidy long format) with nothing pre-aggregated, so paired tests, CIs, per-type splits and judge calibration are all possible downstream.", "community": 8, "community_name": "v3/README.md \u2014 the in-repo canon design...", "source_file": "A:/exjobbet/repo/v3/README.md", "file_type": "rationale", "degree": 3}, {"id": "v3_readme_two_manifests_provenance", "label": "Each run writes a RunManifest (arm, generator model, top-k, questions file, n, timestamp, build stats) on the generation side and an EvalManifest (scorer, judge model, source run, arm, timestamp) on the scoring side; no seed, no git-sha.", "color": {"background": "#EDC948", "border": "#EDC948", "highlight": {"background": "#ffffff", "border": "#EDC948"}}, "size": 13.1, "font": {"size": 0, "color": "#ffffff"}, "title": "Each run writes a RunManifest (arm, generator model, top-k, questions file, n, timestamp, build stats) on the generation side and an EvalManifest (scorer, judge model, source run, arm, timestamp) on the scoring side; no seed, no git-sha.", "community": 5, "community_name": "orchestrator.py", "source_file": "A:/exjobbet/repo/v3/README.md", "file_type": "rationale", "degree": 3}, {"id": "v3_readme_data_quarantine", "label": "The data split is a quarantine: data/corpus/ has the oracle stripped and pipelines see ONLY this via a truth-free prompt, data/raw/ holds full HERB (~1514 questions + ground_truth + citations inside the product files) read by evaluators in place, and metad", "color": {"background": "#9C755F", "border": "#9C755F", "highlight": {"background": "#ffffff", "border": "#9C755F"}}, "size": 14.1, "font": {"size": 0, "color": "#ffffff"}, "title": "The data split is a quarantine: data/corpus/ has the oracle stripped and pipelines see ONLY this via a truth-free prompt, data/raw/ holds full HERB (~1514 questions + ground_truth + citations inside the product files) read by evaluators in place, and metad", "community": 18, "community_name": "Structural quarantine: corpus physically...", "source_file": "A:/exjobbet/repo/v3/README.md", "file_type": "rationale", "degree": 4}, {"id": "v3_readme_two_phase_run_flow", "label": "Generation and scoring are split into two separate phases (modes questions / evals / full) so iterating a scorer never re-runs the LLM; the questions phase answers chosen questions writing an oracle-free records.jsonl + run_manifest.json, the evals phase r", "color": {"background": "#BAB0AC", "border": "#BAB0AC", "highlight": {"background": "#ffffff", "border": "#BAB0AC"}}, "size": 12.1, "font": {"size": 0, "color": "#ffffff"}, "title": "Generation and scoring are split into two separate phases (modes questions / evals / full) so iterating a scorer never re-runs the LLM; the questions phase answers chosen questions writing an oracle-free records.jsonl + run_manifest.json, the evals phase r", "community": 9, "community_name": "State doc 2026-06-25: v3 vector arm + RA...", "source_file": "A:/exjobbet/repo/v3/README.md", "file_type": "rationale", "degree": 2}, {"id": "v3_readme_oracle_free_record", "label": "The questions run record carries no oracle (one oracle-free row per question, appended as it goes so a crash keeps what finished), so you can read it and see the quarantine held; a hard error fails loud and stops.", "color": {"background": "#9C755F", "border": "#9C755F", "highlight": {"background": "#ffffff", "border": "#9C755F"}}, "size": 12.1, "font": {"size": 0, "color": "#ffffff"}, "title": "The questions run record carries no oracle (one oracle-free row per question, appended as it goes so a crash keeps what finished), so you can read it and see the quarantine held; a hard error fails loud and stops.", "community": 18, "community_name": "Structural quarantine: corpus physically...", "source_file": "A:/exjobbet/repo/v3/README.md", "file_type": "rationale", "degree": 2}, {"id": "v3_readme_split_telemetry", "label": "Per-question telemetry is split: ArmOutput.generator (the shared answer-writer, identical across arms) versus ArmOutput.retrieval (the arm's OWN retrieval-time model cost \u2014 vector's query embed, zero for lucene).", "color": {"background": "#9C755F", "border": "#9C755F", "highlight": {"background": "#ffffff", "border": "#9C755F"}}, "size": 13.1, "font": {"size": 0, "color": "#ffffff"}, "title": "Per-question telemetry is split: ArmOutput.generator (the shared answer-writer, identical across arms) versus ArmOutput.retrieval (the arm&#x27;s OWN retrieval-time model cost \u2014 vector&#x27;s query embed, zero for lucene).", "community": 8, "community_name": "v3/README.md \u2014 the in-repo canon design...", "source_file": "A:/exjobbet/repo/v3/README.md", "file_type": "rationale", "degree": 3}, {"id": "v3_readme_contract_shared_shapes", "label": "contract.py holds the shared shapes everything imports (QuestionWithTruth, ModelUsage, ArmOutput, BuildStats, EvalResult, RunManifest, EvalManifest).", "color": {"background": "#9C755F // HTML-escape helper — prevents XSS when injecting graph data into innerHTML
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// Build vis datasets
const nodesDS = new vis.DataSet(RAW_NODES.map(n => ({
  id: n.id, label: n.label, color: n.color, size: n.size,
  font: n.font, title: n.title,
  _community: n.community, _community_name: n.community_name,
  _source_file: n.source_file, _file_type: n.file_type, _degree: n.degree,
})));

const edgesDS = new vis.DataSet(RAW_EDGES.map((e, i) => ({
  id: i, from: e.from, to: e.to,
  label: '',
  title: e.title,
  dashes: e.dashes,
  width: e.width,
  color: e.color,
  arrows: { to: { enabled: true, scaleFactor: 0.5 } },
})));

const container = document.getElementById('graph');
const network = new vis.Network(container, { nodes: nodesDS, edges: edgesDS }, {
  physics: {
    enabled: true,
    solver: 'forceAtlas2Based',
    forceAtlas2Based: {
      gravitationalConstant: -60,
      centralGravity: 0.005,
      springLength: 120,
      springConstant: 0.08,
      damping: 0.4,
      avoidOverlap: 0.8,
    },
    stabilization: { iterations: 200, fit: true },
  },
  interaction: {
    hover: true,
    tooltipDelay: 100,
    hideEdgesOnDrag: true,
    navigationButtons: false,
    keyboard: false,
  },
  nodes: { shape: 'dot', borderWidth: 1.5 },
  edges: { smooth: { type: 'continuous', roundness: 0.2 }, selectionWidth: 3 },
});

network.once('stabilizationIterationsDone', () => {
  network.setOptions({ physics: { enabled: false } });
});

function showInfo(nodeId) {
  const n = nodesDS.get(nodeId);
  if (!n) return;
  const neighborIds = network.getConnectedNodes(nodeId);
  const neighborItems = neighborIds.map(nid => {
    const nb = nodesDS.get(nid);
    const color = nb ? nb.color.background : '#555';
    return `<span class="neighbor-link" style="border-left-color:${esc(color)}" onclick="focusNode(${JSON.stringify(nid)})">${esc(nb ? nb.label : nid)}</span>`;
  }).join('');
  document.getElementById('info-content').innerHTML = `
    <div class="field"><b>${esc(n.label)}</b></div>
    <div class="field">Type: ${esc(n._file_type || 'unknown')}</div>
    <div class="field">Community: ${esc(n._community_name)}</div>
    <div class="field">Source: ${esc(n._source_file || '-')}</div>
    <div class="field">Degree: ${n._degree}</div>
    ${neighborIds.length ? `<div class="field" style="margin-top:8px;color:#aaa;font-size:11px">Neighbors (${neighborIds.length})</div><div id="neighbors-list">${neighborItems}</div>` : ''}
  `;
}

function focusNode(nodeId) {
  network.focus(nodeId, { scale: 1.4, animation: true });
  network.selectNodes([nodeId]);
  showInfo(nodeId);
}

// Track hovered node — hover detection is more reliable than click params
let hoveredNodeId = null;
network.on('hoverNode', params => {
  hoveredNodeId = params.node;
  container.style.cursor = 'pointer';
});
network.on('blurNode', () => {
  hoveredNodeId = null;
  container.style.cursor = 'default';
});
container.addEventListener('click', () => {
  if (hoveredNodeId !== null) {
    showInfo(hoveredNodeId);
    network.selectNodes([hoveredNodeId]);
  }
});
network.on('click', params => {
  if (params.nodes.length > 0) {
    showInfo(params.nodes[0]);
  } else if (hoveredNodeId === null) {
    document.getElementById('info-content').innerHTML = '<span class="empty">Click a node to inspect it</span>';
  }
});

const searchInput = document.getElementById('search');
const searchResults = document.getElementById('search-results');
searchInput.addEventListener('input', () => {
  const q = searchInput.value.toLowerCase().trim();
  searchResults.innerHTML = '';
  if (!q) { searchResults.style.display = 'none'; return; }
  const matches = RAW_NODES.filter(n => n.label.toLowerCase().includes(q)).slice(0, 20);
  if (!matches.length) { searchResults.style.display = 'none'; return; }
  searchResults.style.display = 'block';
  matches.forEach(n => {
    const el = document.createElement('div');
    el.className = 'search-item';
    el.textContent = n.label;
    el.style.borderLeft = `3px solid ${n.color.background}`;
    el.style.paddingLeft = '8px';
    el.onclick = () => {
      network.focus(n.id, { scale: 1.5, animation: true });
      network.selectNodes([n.id]);
      showInfo(n.id);
      searchResults.style.display = 'none';
      searchInput.value = '';
    };
    searchResults.appendChild(el);
  });
});
document.addEventListener('click', e => {
  if (!searchResults.contains(e.target) && e.target !== searchInput)
    searchResults.style.display = 'none';
});

  selectAllCb.checked = hidden === 0;
  selectAllCb.indeterminate = hidden > 0 && hidden < total;
}

function toggleAllCommunities(hide) {
  document.querySelectorAll('.legend-item').forEach(item => {
    hide ? item.classList.add('dimmed') : item.classList.remove('dimmed');
  });
  document.querySelectorAll('.legend-cb').forEach(cb => {
    cb.checked = !hide;
  });
  LEGEND.forEach(c => {
    if (hide) hiddenCommunities.add(c.cid); else hiddenCommunities.delete(c.cid);
  });
  const updates = RAW_NODES.map(n => ({ id: n.id, hidden: hide }));
  nodesDS.update(updates);
  updateSelectAllState();
}

const legendEl = document.getElementById('legend');
LEGEND.forEach(c => {
  const item = document.createElement('div');
  item.className = 'legend-item';
  const cb = document.createElement('input');
  cb.type = 'checkbox';
  cb.className = 'legend-cb';
  cb.checked = true;
  cb.addEventListener('change', (e) => {
    e.stopPropagation();
    if (cb.checked) {
      hiddenCommunities.delete(c.cid);
      item.classList.remove('dimmed');
    } else {
      hiddenCommunities.add(c.cid);
      item.classList.add('dimmed');
    }
    const updates = RAW_NODES
      .filter(n => n.community === c.cid)
      .map(n => ({ id: n.id, hidden: !cb.checked }));
    nodesDS.update(updates);
    updateSelectAllState();
  });
  item.innerHTML = `<div class="legend-dot" style="background:${c.color}"></div>
    <span class="legend-label">${c.label}</span>
    <span class="legend-count">${c.count}</span>`;
  item.prepend(cb);
  item.onclick = (e) => {
    if (e.target === cb) return;
    cb.checked = !cb.checked;
    cb.dispatchEvent(new Event('change'));
  };
  legendEl.appendChild(item);
});
</script>

// afterDrawing passes ctx already transformed to network coordinate space.
// Draw node positions raw — no manual pan/zoom/DPR math needed.
network.on('afterDrawing', function(ctx) {
    hyperedges.forEach(h => {
        const positions = h.nodes
            .map(nid => network.getPositions([nid])[nid])
            .filter(p => p !== undefined);
        if (positions.length < 2) return;
        ctx.save();
        ctx.globalAlpha = 0.12;
        ctx.fillStyle = '#6366f1';
        ctx.strokeStyle = '#6366f1';
        ctx.lineWidth = 2;
        ctx.beginPath();
        // Centroid and expanded hull in network coordinates
        const cx = positions.reduce((s, p) => s + p.x, 0) / positions.length;
        const cy = positions.reduce((s, p) => s + p.y, 0) / positions.length;
        const expanded = positions.map(p => ({
            x: cx + (p.x - cx) * 1.15,
            y: cy + (p.y - cy) * 1.15
        }));
        ctx.moveTo(expanded[0].x, expanded[0].y);
        expanded.slice(1).forEach(p => ctx.lineTo(p.x, p.y));
        ctx.closePath();
        ctx.fill();
        ctx.globalAlpha = 0.4;
        ctx.stroke();
        // Label
        ctx.globalAlpha = 0.8;
        ctx.fillStyle = '#4f46e5';
        ctx.font = 'bold 11px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(h.label, cx, cy - 5);
        ctx.restore();
    });
});
